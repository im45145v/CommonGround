name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: station/requirements-dev.txt }
      - run: pip install -r station/requirements-dev.txt
      - run: python -m pytest -q station/tests
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }   # AGP 8.7 requires JDK 17+
      - uses: android-actions/setup-android@v3                  # accepts SDK licences so AGP can fetch SDK 34
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug   # Gradle 8.9 wrapper, AGP 8.7.3, Kotlin 2.0.21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: commonground-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
