name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r station/requirements-dev.txt
      - run: python -m pytest -q station/tests
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: commonground-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
